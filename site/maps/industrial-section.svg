<g id="is-callouts" fill="var(--map-ink, #d5dbe3)"><text x="6300" y="1150" font-size="200" font-weight="700" fill="#d9a441">Outer band: 0.35 to 0.45 g</text><text x="6300" y="1410" font-size="175">Water and volatile tank farms:</text><text x="6300" y="1635" font-size="175">asteroid water ice, nitrogen compounds.</text><text x="6300" y="1860" font-size="175">Container racks and the cargo rail yard:</text><text x="6300" y="2085" font-size="175">lunar billets, ingots, glass, basalt fibre;</text><text x="6300" y="2310" font-size="175">asteroid metal concentrates.</text><text x="6300" y="2750" font-size="200" font-weight="700" fill="#5fb3a8">Middle band: 0.2 to 0.3 g</text><text x="6300" y="3010" font-size="175">Process units, fabrication cells and</text><text x="6300" y="3235" font-size="175">utility plants: both streams are refined,</text><text x="6300" y="3460" font-size="175">worked and powered here.</text><text x="6300" y="3950" font-size="200" font-weight="700" fill="#7a8de0">Inner band: under 0.15 g</text><text x="6300" y="4210" font-size="175">Light storage and staging cages:</text><text x="6300" y="4435" font-size="175">small lots and free cargo, crew modules,</text><text x="6300" y="4660" font-size="175">tug berths.</text></g>
<g id="is-notes" fill="var(--map-ink, #d5dbe3)" font-size="175">
<path d="M3500 3650L6240 5190" stroke="#d5dbe3" stroke-width="8" stroke-opacity="0.7" fill="none"/>
<text x="6300" y="5240" font-weight="700" font-size="200">Stationary spine</text>
<text x="6300" y="5500">120 m wide, in a 150 m clearance gap</text><text x="6300" y="5725">that carries nothing.</text>
<text x="6300" y="6140" font-weight="700" font-size="200">Mostly empty</text>
<text x="6300" y="6400">70 to 80 percent open vacuum between</text><text x="6300" y="6625">the bands; only spokes and rails cross it.</text>
</g>
<g id="is-title" fill="var(--map-ink, #d5dbe3)"><text x="200" y="330" font-size="380" font-weight="700">EHRICKE · END-ON SECTION</text>
<text x="200" y="700" font-size="240" fill-opacity="0.85">Seen from the spaceport end. Rim 2,245 m, rotor turns clockwise (0.044 rad/s, one turn in 143 s).</text></g>
<text x="5085.3" y="1470.9" font-size="175" fill="var(--map-ink, #d5dbe3)">spin</text>
