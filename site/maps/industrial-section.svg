<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10600 7000" role="img" aria-labelledby="is-t is-d" font-family="DM Sans, system-ui, sans-serif">
<title id="is-t">Ehricke (the industrial rotor): end-on section</title>
<desc id="is-d">The industrial rotor seen end-on from the spaceport end. The rim ring and 24 axial girders carry the structure; eight radial spokes run from the hub collars to the rim. Three gravity bands sit between them: outer 0.35 to 0.45 g, middle 0.2 to 0.3 g, inner under 0.15 g, with open vacuum between. The stationary spine runs through the centre inside a clearance gap. The rotor turns clockwise in this view. Callouts name the material stores in each band. 1 viewBox unit is 1 m.</desc>
<metadata id="is-meta">{"kind":"industrial-section","layoutChecksum":"12834bc0bb6b7b","generator":"281462530ec4"}</metadata>
