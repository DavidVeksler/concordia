<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 348" role="group" aria-labelledby="sl-title sl-desc" font-family="DM Sans, system-ui, sans-serif">
<title id="sl-title">Concordia seen from the side along its 21 km axis</title>
<desc id="sl-desc">Side view to scale from the aft end at minus 10.5 km to the propellant farm at about plus 12 km. From aft: aft works, Tsiolkovsky and Noordung (Rotors 1 and 2) turning one way, Bernal and O'Neill (Rotors 3 and 4) turning the other, the momentum bay, Ehricke (the industrial rotor) in an open bay, the shipyard cage with a ship floating above the spine, the spaceport and piers, and the propellant farm beyond. A stationary spine runs down the middle and the launch track runs along the top from minus 5 km to plus 9.7 km, the last 4.7 km of it a staging guideway to the spaceport. Arrows show which way the near surface of each rotor moves. Each part links to its map section or place page.</desc>
