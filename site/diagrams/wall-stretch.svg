, #28798a)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M432.3 251.4 L445.1 348.6" stroke="var(--accent-2, #a36a20)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 448.6 337.0 L 445.1 348.6 L 438.7 338.3" stroke="var(--accent-2, #a36a20)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M233.8 356.8 L207.8 418.8" stroke="var(--text, #243a43)" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="203.79799149169963" y="438.8" fill="var(--text, #243a43)" font-size="18" text-anchor="end" font-weight="700">Joint opens 2.2 m</text><text x="203.79799149169963" y="459.8" fill="var(--muted, #596b72)" font-size="16" text-anchor="end" font-weight="400">on every 654.5 m bay line</text><text x="421.1" y="285.5" fill="var(--text, #243a43)" font-size="18" text-anchor="end" font-weight="700">Radius grows 8.5 m</text><text x="421.1" y="306.5" fill="var(--muted, #596b72)" font-size="16" text-anchor="end" font-weight="400">circumference 53 m</text><text x="86.5" y="156.0" fill="var(--muted, #596b72)" font-size="17" text-anchor="start" font-weight="700">Empty</text><text x="504.3" y="376.7" fill="var(--text, #243a43)" font-size="17" text-anchor="start" font-weight="700">Loaded: pressurised</text><text x="504.3" y="397.7" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">and spinning</text><text x="340.0" y="194.5" fill="var(--muted, #596b72)" font-size="16" text-anchor="middle" font-weight="400">One bay of the underframe</text><text x="356.0" y="385.5" fill="var(--accent, #28798a)" font-size="16" text-anchor="middle" font-weight="700">Bands stretch without a break</text><text x="700" y="186" fill="var(--text, #243a43)" font-size="18" text-anchor="start" font-weight="700">Where the stretch comes from</text><rect x="700" y="204" width="174.6" height="26" rx="3" fill="var(--accent, #28798a)" stroke="none"></rect><rect x="874.6" y="204" width="85.4" height="26" rx="3" fill="var(--accent-2, #a36a20)" stroke="none"></rect><text x="700" y="254" fill="var(--accent, #28798a)" font-size="16" text-anchor="start" font-weight="700">Pressurisation, 67 percent</text><text x="700" y="276" fill="var(--accent-2, #a36a20)" font-size="16" text-anchor="start" font-weight="700">Spin-up, 33 percent</text><text x="700" y="326" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">The carbon bands stretch 0.335</text><text x="700" y="348" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">percent at their working stress.</text><text x="700" y="370" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">The underframe, ground deck,</text><text x="700" y="392" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">rails and pipes are cut by a</text><text x="700" y="414" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">movement joint on every bay line.</text><text x="32" y="504" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">Stretch drawn about 40 times larger than true; the numbers are true.</text><text x="32" y="538" fill="var(--muted, #596b72)" font-size="12" text-anchor="start" font-weight="600">CONCORDIA / ORIGINAL EXPLANATORY ILLUSTRATION</text>
</svg>
