<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" style="min-width: 800px" role="img" aria-labelledby="eg-wall-stretch-title eg-wall-stretch-desc" class="editorial-graphic" font-family="system-ui, sans-serif">
<title id="eg-wall-stretch-title">The wall stretches when it is loaded</title><desc id="eg-wall-stretch-desc">Three bays of the underframe on an arc, drawn twice. Empty, the bays fit edge to edge over the tension bands. Loaded, the bands have stretched 0.335 percent, the radius has grown 8.5 m and the circumference 53 m, so the movement joint on each 654.5 m bay line has opened 2.2 m. About two thirds of the stretch comes with pressurisation and a third with spin-up. The stretch is drawn about 40 times larger than true.</desc>
