<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="to-title to-desc" font-family="DM Sans, system-ui, sans-serif" font-size="16">
  <title id="to-title">The 15 day Earth transfer, schematic</title>
  <desc id="to-desc">Not to scale. Earth at left, the Moon on its orbit to the right, and Concordia at L5, 60 degrees behind the Moon on the same orbit. The path leaves L5 at day 0, swings past the Moon at day 6, and reaches Earth capture at day 15, where a 395 metre per second burn at 400 kilometre perigee enters a long orbit of about 21 hours.</desc>
  <defs>
    <marker id="to-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
  </defs>
  <circle cx="150" cy="190" r="200" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>
  <ellipse cx="205" cy="190" rx="62" ry="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/>
  <circle cx="150" cy="190" r="20" fill="var(--accent-2)" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="350" cy="190" r="9" fill="var(--muted)" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="250" cy="363" r="7" fill="var(--accent)" stroke="currentColor" stroke-width="1.5"/>
  <path d="M250 363 C 335 335 392 262 366 214 C 350 182 312 160 262 176 C 218 190 190 188 172 186" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#to-arrow)"/>
  <g fill="currentColor" stroke="none">
    <circle cx="366" cy="214" r="4"/><circle cx="262" cy="176" r="4"/>
  </g>
  <g fill="currentColor">
    <text x="150" y="232" text-anchor="middle">Earth</text>
    <text x="368" y="170">Moon</text>
    <text x="250" y="396" text-anchor="middle">L5 (Concordia), day 0</text>
    <text x="384" y="252">Swing-by, day 6</text>
    <text x="262" y="154" text-anchor="middle">Capture, day 15</text>
    <text x="150" y="28" text-anchor="middle" opacity="0.75" font-size="15">Moon's orbit, 384,400 km</text>
  </g>
  <g fill="currentColor">
    <text x="520" y="70" font-weight="600">Propulsion after the launcher</text>
    <text x="520" y="106">Departure burn: 250 m/s</text>
    <text x="520" y="134">Lunar swing-by: 0 m/s</text>
    <text x="520" y="162">Midcourse: 20 m/s</text>
    <text x="520" y="190">Earth capture: 395 m/s</text>
    <text x="520" y="230" opacity="0.85">Capture orbit: 400 km by 70,000 km,</text>
    <text x="520" y="254" opacity="0.85">about 21 h per lap.</text>
    <text x="520" y="298" opacity="0.85">Schematic: not to scale.</text>
  </g>
</svg>
