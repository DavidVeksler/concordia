<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="to-title to-desc" font-family="DM Sans, system-ui, sans-serif" font-size="16">
  <title id="to-title">The 5 day Earth transfer, schematic</title>
  <desc id="to-desc">Not to scale. Earth at left, the Moon on its orbit to the right, and Concordia at L5, 60 degrees behind the Moon on the same orbit. The path is half an ellipse: it leaves L5 at day 0, passes the midcourse trim at day 2, swings round Earth and reaches capture at day 5, where a 546 metre per second burn at 950 kilometre perigee enters the transfer station's orbit, 950 by 47,527 kilometres, one lap in 14.8 hours. The Moon stays far off the whole way.</desc>
  <defs>
    <marker id="to-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
  </defs>
  <circle cx="150" cy="190" r="200" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>
  <ellipse cx="168" cy="221" rx="62" ry="24" transform="rotate(60 168 221)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/>
  <circle cx="150" cy="190" r="20" fill="var(--accent-2)" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="350" cy="190" r="9" fill="var(--muted)" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="250" cy="363" r="7" fill="var(--accent)" stroke="currentColor" stroke-width="1.5"/>
  <path d="M250 363 A 113 72 60 0 0 137 167.5" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#to-arrow)"/>
  <g fill="currentColor" stroke="none">
    <circle cx="277" cy="294" r="4"/><circle cx="137" cy="167.5" r="4"/>
  </g>
  <g fill="currentColor">
    <text x="150" y="236" text-anchor="middle">Earth</text>
    <text x="364" y="172">Moon</text>
    <text x="250" y="396" text-anchor="middle">L5 (Concordia), day 0</text>
    <text x="290" y="290">Midcourse, day 2</text>
    <text x="118" y="146" text-anchor="middle">Capture, day 5</text>
    <text x="150" y="28" text-anchor="middle" opacity="0.75" font-size="15">Moon's orbit, 384,400 km</text>
  </g>
  <g fill="currentColor">
    <text x="520" y="70" font-weight="600">Propulsion after the launcher</text>
    <text x="520" y="106">Departure burn: 281 m/s</text>
    <text x="520" y="134">Midcourse: 20 m/s</text>
    <text x="520" y="162">Station capture: 546 m/s</text>
    <text x="520" y="202" opacity="0.85">Station orbit: 950 km by 47,527 km,</text>
    <text x="520" y="226" opacity="0.85">14.8 h per lap.</text>
    <text x="520" y="266" opacity="0.85">The Moon stays over 370,000 km away.</text>
    <text x="520" y="306" opacity="0.85">Schematic: not to scale.</text>
  </g>
</svg>
