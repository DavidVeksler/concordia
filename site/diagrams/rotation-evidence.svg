<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 665" role="img" aria-labelledby="eg-rotation-evidence-title eg-rotation-evidence-desc" class="editorial-graphic" font-family="system-ui, sans-serif">
<title id="eg-rotation-evidence-title">What was actually tested?</title><desc id="eg-rotation-evidence-desc">Selected studies from the calculator’s sources. Experiments are distinct from design recommendations.</desc>
<rect x="0" y="0" width="1000" height="665" rx="12" fill="var(--surface, #faf8f0)" stroke="none"></rect><path d="M32 23 h56" stroke="var(--accent, #28798a)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="32" y="65" fill="var(--text, #243a43)" font-size="30" text-anchor="start" font-weight="700">What was actually tested?</text><text x="32" y="96" fill="var(--muted, #596b72)" font-size="18" text-anchor="start" font-weight="400">Selected studies from the calculator’s sources. Experiments are distinct from design recommendations.</text><rect x="32" y="146" width="936" height="125" rx="10" fill="var(--surface-2, #ece9de)" stroke="none"></rect><circle cx="104" cy="208" r="39" fill="var(--surface, #faf8f0)" stroke="var(--accent, #28798a)" stroke-width="2"></circle><rect x="77" y="185" width="54" height="47" rx="1" fill="var(--surface-2, #ece9de)" stroke="var(--text, #243a43)"></rect><g transform="translate(105 231) rotate(0) scale(0.6)"><circle cx="0" cy="-48" r="7" fill="var(--text, #243a43)" stroke="var(--text, #243a43)" stroke-width="2"></circle><path d="M0 -38 V-16 M-15 -29 L0 -35 L15 -29 M0 -16 L-12 0 M0 -16 L12 0" stroke="var(--text, #243a43)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></g><text x="165" y="178" fill="var(--text, #243a43)" font-size="22" text-anchor="start" font-weight="700">Slow Rotation Room</text><text x="165" y="205" fill="var(--accent, #28798a)" font-size="16" text-anchor="start" font-weight="400">1969 / human room study</text><text x="485" y="192" fill="var(--muted, #596b72)" font-size="17" text-anchor="start" font-weight="400">10 men; rate increased in 1 rpm steps.</text><text x="485" y="222" fill="var(--muted, #596b72)" font-size="17" text-anchor="start" font-weight="400">6 reached 10 rpm; 4 did not.</text><rect x="32" y="285" width="936" height="125" rx="10" fill="var(--surface-2, #ece9de)" stroke="none"></rect><circle cx="104" cy="347" r="39" fill="var(--surface, #faf8f0)" stroke="var(--accent, #28798a)" stroke-width="2"></circle><g transform="translate(104 375) rotate(0) scale(0.8)"><circle cx="0" cy="-48" r="7" fill="var(--text, #243a43)" stroke="var(--text, #243a43)" stroke-width="2"></circle><path d="M0 -38 V-16 M-15 -29 L0 -35 L15 -29 M0 -16 L-12 0 M0 -16 L12 0" stroke="var(--text, #243a43)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M70 347 h67" stroke="var(--accent-2, #a36a20)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="165" y="317" fill="var(--text, #243a43)" font-size="22" text-anchor="start" font-weight="700">Bed-rest centrifuge</text><text x="165" y="344" fill="var(--accent, #28798a)" font-size="16" text-anchor="start" font-weight="400">2007 / pilot countermeasure</text><text x="485" y="331" fill="var(--muted, #596b72)" font-size="17" text-anchor="start" font-weight="400">15 men; 8 received 1 hour/day centrifugation.</text><text x="485" y="361" fill="var(--muted, #596b72)" font-size="17" text-anchor="start" font-weight="400">3 m radius; 2.5 g at feet, 1.0 g at heart.</text><rect x="32" y="424" width="936" height="125" rx="10" fill="var(--surface-2, #ece9de)" stroke="none"></rect><circle cx="104" cy="486" r="39" fill="var(--surface, #faf8f0)" stroke="var(--accent, #28798a)" stroke-width="2"></circle><ellipse cx="103" cy="490" rx="21" ry="12" fill="var(--text, #243a43)"></ellipse><circle cx="120" cy="484" r="8" fill="var(--text, #243a43)" stroke="none" stroke-width="2"></circle><path d="M82 490 q-20 -15 -18 0" stroke="var(--text, #243a43)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="165" y="456" fill="var(--text, #243a43)" font-size="22" text-anchor="start" font-weight="700">ISS mouse centrifuge</text><text x="165" y="483" fill="var(--accent, #28798a)" font-size="16" text-anchor="start" font-weight="400">2017 / animal experiment</text><text x="485" y="470" fill="var(--muted, #596b72)" font-size="17" text-anchor="start" font-weight="400">12 male mice; 35 days.</text><text x="485" y="500" fill="var(--muted, #596b72)" font-size="17" text-anchor="start" font-weight="400">Artificial 1 g compared with microgravity.</text><text x="500" y="605" fill="var(--text, #243a43)" font-size="18" text-anchor="middle" font-weight="400">Recommendations extrapolate from limited experiments; they are not universal comfort boundaries.</text><text x="32" y="643" fill="var(--muted, #596b72)" font-size="12" text-anchor="start" font-weight="600">CONCORDIA / ORIGINAL EXPLANATORY ILLUSTRATION</text>
