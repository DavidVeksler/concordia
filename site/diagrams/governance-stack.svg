<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 756" role="img" aria-labelledby="eg-governance-stack-title eg-governance-stack-desc" class="editorial-graphic" font-family="system-ui, sans-serif">
<title id="eg-governance-stack-title">Who answers to whom</title><desc id="eg-governance-stack-desc">A chain of authority from the Outer Space Treaty through the United Kingdom, the Outer Space Act as extended to Bermuda and the Charter, down to the Covenant. Below the Covenant sit the Proprietors’ Council, the Charter Authority and the Resident class, then the arbitration providers and a division of the Supreme Court of Bermuda. Appeals from the Supreme Court go to the Court of Appeal for Bermuda and the Privy Council. The top four layers are the floor set by the state; the rest is contract.</desc>
<rect x="0" y="0" width="1000" height="756" rx="12" fill="var(--surface, #faf8f0)" stroke="none"></rect><path d="M32 23 h56" stroke="var(--accent, #28798a)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="32" y="65" fill="var(--text, #243a43)" font-size="30" text-anchor="start" font-weight="700">Who answers to whom</text><text x="32" y="96" fill="var(--muted, #596b72)" font-size="18" text-anchor="start" font-weight="400">Real treaty and statute on top; contract between the owners below. Concordia’s fictional 2045 charter.</text><rect x="200" y="124" width="500" height="60" rx="8" fill="var(--surface-2, #ece9de)" stroke="var(--accent, #28798a)"></rect><text x="450.0" y="149.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="700">Outer Space Treaty</text><text x="450.0" y="169.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="400">Arts. II, VI and VIII</text><rect x="200" y="202" width="500" height="60" rx="8" fill="var(--surface-2, #ece9de)" stroke="var(--accent, #28798a)"></rect><text x="450.0" y="227.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="700">United Kingdom</text><text x="450.0" y="247.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="400">answering state and registry</text><rect x="200" y="280" width="500" height="60" rx="8" fill="var(--surface-2, #ece9de)" stroke="var(--accent, #28798a)"></rect><text x="450.0" y="305.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="700">Outer Space Act 1986 as extended to Bermuda</text><text x="450.0" y="325.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="400">the Governor’s licence</text><rect x="200" y="358" width="500" height="60" rx="8" fill="var(--surface-2, #ece9de)" stroke="var(--accent-2, #a36a20)"></rect><text x="450.0" y="383.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="700">The Charter</text><text x="450.0" y="403.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="400">private Act of Bermuda plus the licence</text><rect x="200" y="436" width="500" height="60" rx="8" fill="var(--surface-2, #ece9de)" stroke="var(--accent-2, #a36a20)"></rect><text x="450.0" y="461.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="700">The Covenant</text><text x="450.0" y="481.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="400">signed by everyone aboard</text><path d="M450 184 L450 202" stroke="var(--muted, #596b72)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 455.0 191.0 L 450 202 L 445.0 191.0" stroke="var(--muted, #596b72)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M450 262 L450 280" stroke="var(--muted, #596b72)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 455.0 269.0 L 450 280 L 445.0 269.0" stroke="var(--muted, #596b72)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M450 340 L450 358" stroke="var(--muted, #596b72)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 455.0 347.0 L 450 358 L 445.0 347.0" stroke="var(--muted, #596b72)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M450 418 L450 436" stroke="var(--muted, #596b72)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 455.0 425.0 L 450 436 L 445.0 425.0" stroke="var(--muted, #596b72)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M450 496 L450 514" stroke="var(--muted, #596b72)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 455.0 503.0 L 450 514 L 445.0 503.0" stroke="var(--muted, #596b72)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><rect x="200" y="514" width="160" height="60" rx="8" fill="var(--surface-2, #ece9de)" stroke="var(--accent-2, #a36a20)"></rect><text x="280.0" y="539.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="700">Proprietors’</text><text x="280.0" y="559.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="400">Council</text><rect x="370" y="514" width="160" height="60" rx="8" fill="var(--surface-2, #ece9de)" stroke="var(--accent-2, #a36a20)"></rect><text x="450.0" y="539.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="700">Charter</text><text x="450.0" y="559.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="400">Authority</text><rect x="540" y="514" width="160" height="60" rx="8" fill="var(--surface-2, #ece9de)" stroke="var(--accent-2, #a36a20)"></rect><text x="620.0" y="539.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="700">Resident</text><text x="620.0" y="559.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="400">class</text><path d="M450 496 V505 M280 505 H620 M280 505 V514 M620 505 V514" stroke="var(--muted, #596b72)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><rect x="200" y="592" width="245" height="64" rx="8" fill="var(--surface-2, #ece9de)" stroke="var(--accent-2, #a36a20)"></rect><text x="322.5" y="619.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="700">Arbitration providers</text><text x="322.5" y="639.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="400">chosen by contract</text><rect x="455" y="592" width="245" height="64" rx="8" fill="var(--surface-2, #ece9de)" stroke="var(--accent, #28798a)"></rect><text x="577.5" y="619.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="700">Supreme Court of Bermuda</text><text x="577.5" y="639.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="400">sitting division</text><path d="M450 574 V583 M322 583 H578 M322 583 V592 M578 583 V592" stroke="var(--muted, #596b72)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><rect x="740" y="514" width="230" height="60" rx="8" fill="var(--surface-2, #ece9de)" stroke="var(--accent, #28798a)"></rect><text x="855.0" y="539.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="700">Privy Council</text><text x="855.0" y="559.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="400">final appeal</text><rect x="740" y="592" width="230" height="64" rx="8" fill="var(--surface-2, #ece9de)" stroke="var(--accent, #28798a)"></rect><text x="855.0" y="619.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="700">Court of Appeal</text><text x="855.0" y="639.0" fill="var(--text, #243a43)" font-size="16" text-anchor="middle" font-weight="400">for Bermuda</text><path d="M700 624 H740" stroke="var(--accent, #28798a)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M855 592 L855 574" stroke="var(--accent, #28798a)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 850.0 585.0 L 855 574 L 860.0 585.0" stroke="var(--accent, #28798a)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="855" y="500" fill="var(--muted, #596b72)" font-size="15" text-anchor="middle" font-weight="400">Appeals run back up</text><path d="M186 124 V418 M186 124 H194 M186 418 H194" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="176" y="236" fill="var(--accent, #28798a)" font-size="20" text-anchor="end" font-weight="700">The floor</text><text x="176" y="260" fill="var(--muted, #596b72)" font-size="16" text-anchor="end" font-weight="400">(the state)</text><path d="M186 436 V656 M186 436 H194 M186 656 H194" stroke="var(--accent-2, #a36a20)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="176" y="502" fill="var(--accent-2, #a36a20)" font-size="20" text-anchor="end" font-weight="700">Contract</text><text x="176" y="526" fill="var(--muted, #596b72)" font-size="16" text-anchor="end" font-weight="400">(the owners)</text><rect x="200" y="682" width="18" height="18" rx="2" fill="var(--surface-2, #ece9de)" stroke="var(--accent, #28798a)"></rect><text x="226" y="697" fill="var(--text, #243a43)" font-size="16" text-anchor="start" font-weight="400">Real law</text><rect x="330" y="682" width="18" height="18" rx="2" fill="var(--surface-2, #ece9de)" stroke="var(--accent-2, #a36a20)"></rect><text x="356" y="697" fill="var(--text, #243a43)" font-size="16" text-anchor="start" font-weight="400">Story</text><text x="32" y="734" fill="var(--muted, #596b72)" font-size="12" text-anchor="start" font-weight="600">CONCORDIA / ORIGINAL EXPLANATORY ILLUSTRATION</text>
</svg>
