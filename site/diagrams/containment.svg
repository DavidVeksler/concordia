  <text x="150" y="530" text-anchor="middle" fill="currentColor" font-weight="600">One breach</text>
  <text x="150" y="552" text-anchor="middle" fill="currentColor" font-weight="600">reaches everyone</text>
  <line x1="262" y1="50" x2="262" y2="560" stroke="currentColor" stroke-width="1" opacity="0.2"/>
  <text x="540" y="30" text-anchor="middle" font-weight="700" font-size="19" fill="currentColor">Nested rooms</text>
