    <text x="316" y="302" font-weight="600" paint-order="stroke" stroke="var(--surface)" stroke-width="6">Rotor: six districts</text><text x="316" y="322" font-size="15" fill="var(--muted)" paint-order="stroke" stroke="var(--surface)" stroke-width="6">(illustrative count)</text>
    <text x="316" y="450" font-weight="600">District: blocks, some with a refuge hall</text>
