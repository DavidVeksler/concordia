<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="ct-title ct-desc" font-family="DM Sans, system-ui, sans-serif" font-size="16">
  <title id="ct-title">How far does one failure reach?</title>
  <desc id="ct-desc">Two columns. Left, one room: a single long volume with one breach, and the whole volume is affected. Right, nested rooms: Concordia is a spine and four rotors, two spinning each way. One rotor is split into six pressure and fire districts divided by barriers. The district count is illustrative, because the engineering specification says only several. A breach in one district leaves the other districts untouched, and the district itself is divided into blocks, some with refuge halls. Refuge capsules sit along the spine.</desc>
  <text x="150" y="30" text-anchor="middle" font-weight="700" font-size="19" fill="currentColor">One room</text>
