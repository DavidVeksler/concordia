<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 474" role="img" aria-labelledby="es-title es-desc" font-family="DM Sans, system-ui, sans-serif" font-size="15">
  <title id="es-title">Where the elements are: Earth, Moon and asteroids</title>
  <desc id="es-desc">A grid of eleven elements against four sources: Earth’s crust, lunar soil, carbon-rich (carbonaceous) asteroids and metal-rich asteroids. Darker cells hold more of the element. The Moon is rich in oxygen, silicon, aluminium, iron and titanium but poor in water, carbon and nitrogen. Carbon-rich asteroids hold about 10 percent water and a few percent carbon. Metal-rich asteroids are about 90 percent iron with nickel, cobalt and tens of parts per million of platinum-group metals. Earth has everything, but at the bottom of a deep gravity well.</desc>
