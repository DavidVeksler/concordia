    <text x="247" y="40">Earth’s</text>
    <text x="247" y="58">crust</text>
    <text x="405" y="49">Moon soil</text>
    <text x="563" y="40">Carbon-rich</text>
    <text x="563" y="58">asteroid</text>
    <text x="721" y="40">Metal-rich</text>
    <text x="721" y="58">asteroid</text>
  </g>
  <g fill="currentColor" font-size="13" opacity="0.75" text-anchor="middle">
    <text x="247" y="72">62.7 MJ/kg to leave</text>
    <text x="405" y="72">2.8 MJ/kg to leave</text>
    <text x="563" y="72">almost free to leave</text>
    <text x="721" y="72">almost free to leave</text>
  </g>
