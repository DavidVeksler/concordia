<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="eg-l5-orientation-title eg-l5-orientation-desc" class="editorial-graphic" font-family="system-ui, sans-serif">
<title id="eg-l5-orientation-title">Where is Concordia?</title><desc id="eg-l5-orientation-desc">Plan view in the Moon’s orbital plane. Orbital geometry is schematic.</desc>
<rect x="0" y="0" width="1000" height="680" rx="12" fill="var(--surface, #faf8f0)" stroke="none"></rect><path d="M32 23 h56" stroke="var(--accent, #28798a)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="32" y="65" fill="var(--text, #243a43)" font-size="30" text-anchor="start" font-weight="700">Where is Concordia?</text><text x="32" y="96" fill="var(--muted, #596b72)" font-size="18" text-anchor="start" font-weight="400">Plan view in the Moon’s orbital plane. Orbital geometry is schematic.</text><circle cx="380" cy="365" r="208" fill="none" stroke="var(--muted, #596b72)" stroke-width="2" stroke-dasharray="5 7"></circle><path d="M380 365 L588 365 L484 545 Z" stroke="var(--accent, #28798a)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="380" cy="365" r="25" fill="var(--accent, #28798a)" stroke="none" stroke-width="2"></circle><circle cx="588" cy="365" r="10" fill="var(--surface-2, #ece9de)" stroke="var(--text, #243a43)" stroke-width="2"></circle><circle cx="484" cy="545" r="8" fill="var(--accent-2, #a36a20)" stroke="none" stroke-width="2"></circle><text x="332" y="335" fill="var(--text, #243a43)" font-size="20" text-anchor="start" font-weight="400">Earth</text><text x="588" y="336" fill="var(--text, #243a43)" font-size="20" text-anchor="middle" font-weight="400">Moon</text><text x="501" y="548" fill="var(--accent-2, #a36a20)" font-size="20" text-anchor="start" font-weight="700">L5 region</text><path d="M568 292 Q592 317 592 343" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M591 333 L592 343" stroke="var(--accent, #28798a)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 595.9 331.6 L 592 343 L 585.9 332.6" stroke="var(--accent, #28798a)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="640" y="257" fill="var(--accent, #28798a)" font-size="18" text-anchor="start" font-weight="400">Moon’s motion</text><path d="M632 265 L587 302" stroke="var(--muted, #596b72)" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="420" y="351" fill="var(--accent, #28798a)" font-size="18" text-anchor="start" font-weight="400">60°</text><text x="650" y="365" fill="var(--muted, #596b72)" font-size="20" text-anchor="start" font-weight="400">L5 trails the Moon.</text><text x="650" y="394" fill="var(--muted, #596b72)" font-size="20" text-anchor="start" font-weight="400">The ideal geometry is</text><text x="650" y="423" fill="var(--muted, #596b72)" font-size="20" text-anchor="start" font-weight="400">an equilateral triangle.</text><text x="650" y="452" fill="var(--muted, #596b72)" font-size="20" text-anchor="start" font-weight="400"></text><text x="650" y="481" fill="var(--muted, #596b72)" font-size="20" text-anchor="start" font-weight="400">Concordia follows a</text><text x="650" y="510" fill="var(--muted, #596b72)" font-size="20" text-anchor="start" font-weight="400">controlled path nearby,</text><text x="650" y="539" fill="var(--muted, #596b72)" font-size="20" text-anchor="start" font-weight="400">with stationkeeping.</text><text x="175" y="620" fill="var(--muted, #596b72)" font-size="18" text-anchor="start" font-weight="400">Earth–Moon distance: about 384,400 km. Bodies and station are enlarged.</text><text x="32" y="658" fill="var(--muted, #596b72)" font-size="12" text-anchor="start" font-weight="600">CONCORDIA / ORIGINAL EXPLANATORY ILLUSTRATION</text>
</svg>
