<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 486" role="img" aria-labelledby="ocs-title ocs-desc" font-family="DM Sans, system-ui, sans-serif" font-size="15">
  <title id="ocs-title">Levelized cost per kW-year of new-chip work on the ground and in orbit for three presets</title>
