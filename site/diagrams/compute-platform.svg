<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="eg-compute-platform-title eg-compute-platform-desc" class="editorial-graphic" font-family="system-ui, sans-serif">
<title id="eg-compute-platform-title">Inside a compute platform</title><desc id="eg-compute-platform-desc">A schematic with two rows. Hierarchy: a platform of 1.43 GW holds 4 clusters of 325 MW, each cluster 13 pods of 25 MW, each pod 208 rack equivalents of 120 kW with 72 accelerators each. Heat path: sunlight, solar blanket, pods, ammonia loop, radiator wings of isolated panels at 330 K, and out to space as infrared.</desc>
<rect x="0" y="0" width="1000" height="640" rx="12" fill="var(--surface, #faf8f0)" stroke="none"></rect><path d="M32 23 h56" stroke="var(--accent, #28798a)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="32" y="65" fill="var(--text, #243a43)" font-size="30" text-anchor="start" font-weight="700">Inside a compute platform</text><text x="32" y="96" fill="var(--muted, #596b72)" font-size="18" text-anchor="start" font-weight="400">Sunlight in, heat out: four levels from platform to rack equivalent, and the path every watt takes.</text><text x="32" y="150" fill="var(--text, #243a43)" font-size="22" text-anchor="start" font-weight="700">Hierarchy</text><rect x="32" y="168" width="190" height="128" rx="12" fill="var(--surface-2, #ece9de)" stroke="var(--accent, #28798a)"></rect><text x="48" y="200" fill="var(--accent, #28798a)" font-size="20" text-anchor="start" font-weight="700">Platform</text><text x="48" y="232" fill="var(--text, #243a43)" font-size="19" text-anchor="start" font-weight="700">1.43 GW</text><text x="48" y="260" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">delivered</text><text x="48" y="282" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">4.2 km², 4 clusters</text><path d="M226 232.0 L277 232.0" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 266.0 227.0 L 277 232.0 L 266.0 237.0" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="251.5" y="222.0" fill="var(--accent, #28798a)" font-size="16" text-anchor="middle" font-weight="700">× 4</text><rect x="281" y="168" width="190" height="128" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--accent, #28798a)"></rect><text x="297" y="200" fill="var(--accent, #28798a)" font-size="20" text-anchor="start" font-weight="700">Cluster</text><text x="297" y="232" fill="var(--text, #243a43)" font-size="19" text-anchor="start" font-weight="700">325 MW</text><text x="297" y="260" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">of compute</text><text x="297" y="282" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">13 pods, 2 wings</text><path d="M475 232.0 L526 232.0" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 515.0 227.0 L 526 232.0 L 515.0 237.0" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="500.5" y="222.0" fill="var(--accent, #28798a)" font-size="16" text-anchor="middle" font-weight="700">× 13</text><rect x="530" y="168" width="190" height="128" rx="12" fill="var(--surface-2, #ece9de)" stroke="var(--accent, #28798a)"></rect><text x="546" y="200" fill="var(--accent, #28798a)" font-size="20" text-anchor="start" font-weight="700">Pod</text><text x="546" y="232" fill="var(--text, #243a43)" font-size="19" text-anchor="start" font-weight="700">25 MW</text><text x="546" y="260" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">of compute</text><text x="546" y="282" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">10 × 10 × 14 m inside</text><path d="M724 232.0 L775 232.0" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 764.0 227.0 L 775 232.0 L 764.0 237.0" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="749.5" y="222.0" fill="var(--accent, #28798a)" font-size="16" text-anchor="middle" font-weight="700">× 208</text><rect x="779" y="168" width="190" height="128" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--accent, #28798a)"></rect><text x="795" y="200" fill="var(--accent, #28798a)" font-size="20" text-anchor="start" font-weight="700">Rack equivalent</text><text x="795" y="232" fill="var(--text, #243a43)" font-size="19" text-anchor="start" font-weight="700">120 kW</text><text x="795" y="260" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">72 accelerators</text><text x="795" y="282" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">one cartridge swap</text><text x="32" y="322" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">The 4 clusters fill the platform: 52 pods, 1.30 GW of compute, 0.13 GW of conversion, pumps and robots.</text><text x="32" y="372" fill="var(--text, #243a43)" font-size="22" text-anchor="start" font-weight="700">Heat path</text><rect x="32.0" y="392" width="138" height="112" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--accent-2, #a36a20)"></rect><text x="101.0" y="422" fill="var(--accent-2, #a36a20)" font-size="17" text-anchor="middle" font-weight="700">Sunlight</text><text x="101.0" y="450" fill="var(--muted, #596b72)" font-size="15" text-anchor="middle" font-weight="400">1,361 W/m²</text><text x="101.0" y="472" fill="var(--muted, #596b72)" font-size="15" text-anchor="middle" font-weight="400">at L5</text><path d="M172.0 448 L189.6 448" stroke="var(--accent-2, #a36a20)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 178.6 443.0 L 189.6 448 L 178.6 453.0" stroke="var(--accent-2, #a36a20)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><rect x="191.6" y="392" width="138" height="112" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--accent, #28798a)"></rect><text x="260.6" y="422" fill="var(--accent, #28798a)" font-size="17" text-anchor="middle" font-weight="700">Solar blanket</text><text x="260.6" y="450" fill="var(--muted, #596b72)" font-size="15" text-anchor="middle" font-weight="400">340 W/m²</text><text x="260.6" y="472" fill="var(--muted, #596b72)" font-size="15" text-anchor="middle" font-weight="400">delivered</text><path d="M331.6 448 L349.20000000000005 448" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 338.2 443.0 L 349.20000000000005 448 L 338.2 453.0" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><rect x="351.2" y="392" width="138" height="112" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--accent, #28798a)"></rect><text x="420.2" y="422" fill="var(--accent, #28798a)" font-size="17" text-anchor="middle" font-weight="700">Pods</text><text x="420.2" y="450" fill="var(--muted, #596b72)" font-size="15" text-anchor="middle" font-weight="400">25 MW each</text><text x="420.2" y="472" fill="var(--muted, #596b72)" font-size="15" text-anchor="middle" font-weight="400">electricity to heat</text><path d="M491.2 448 L508.8 448" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 497.8 443.0 L 508.8 448 L 497.8 453.0" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><rect x="510.79999999999995" y="392" width="138" height="112" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--accent, #28798a)"></rect><text x="579.8" y="422" fill="var(--accent, #28798a)" font-size="17" text-anchor="middle" font-weight="700">Ammonia loop</text><text x="579.8" y="450" fill="var(--muted, #596b72)" font-size="15" text-anchor="middle" font-weight="400">3,575 kg/s</text><text x="579.8" y="472" fill="var(--muted, #596b72)" font-size="15" text-anchor="middle" font-weight="400">per cluster</text><text x="579.8" y="494" fill="var(--muted, #596b72)" font-size="15" text-anchor="middle" font-weight="400">1.17 m headers</text><path d="M650.8 448 L668.4 448" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 657.4 443.0 L 668.4 448 L 657.4 453.0" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><rect x="670.4" y="392" width="138" height="112" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--accent-2, #a36a20)"></rect><text x="739.4" y="422" fill="var(--accent-2, #a36a20)" font-size="17" text-anchor="middle" font-weight="700">Radiator wings</text><text x="739.4" y="450" fill="var(--muted, #596b72)" font-size="15" text-anchor="middle" font-weight="400">20 panels a wing</text><text x="739.4" y="472" fill="var(--muted, #596b72)" font-size="15" text-anchor="middle" font-weight="400">1,210 W/m²</text><text x="739.4" y="494" fill="var(--muted, #596b72)" font-size="15" text-anchor="middle" font-weight="400">at 330 K</text><path d="M810.4 448 L828.0 448" stroke="var(--accent-2, #a36a20)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 817.0 443.0 L 828.0 448 L 817.0 453.0" stroke="var(--accent-2, #a36a20)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><rect x="830.0" y="392" width="138" height="112" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--accent-2, #a36a20)"></rect><text x="899.0" y="422" fill="var(--accent-2, #a36a20)" font-size="17" text-anchor="middle" font-weight="700">Space</text><text x="899.0" y="450" fill="var(--muted, #596b72)" font-size="15" text-anchor="middle" font-weight="400">infrared</text><text x="899.0" y="472" fill="var(--muted, #596b72)" font-size="15" text-anchor="middle" font-weight="400">1.43 GW out</text><path d="M 32 530 H 968" stroke="var(--muted, #596b72)" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="32" y="556" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">Every delivered watt ends as heat. A punctured panel closes its own loop: one of 40 in a cluster, 2.5 % of its rejection.</text><text x="32" y="580" fill="var(--muted, #596b72)" font-size="16" text-anchor="start" font-weight="400">Radiators run at chip-coolant temperature, 330 K, edge-on to the Sun, so they look dark in visible light.</text><text x="32" y="618" fill="var(--muted, #596b72)" font-size="12" text-anchor="start" font-weight="600">CONCORDIA / ORIGINAL EXPLANATORY ILLUSTRATION</text>
</svg>
