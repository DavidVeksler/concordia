<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="ocr-title ocr-desc" font-family="DM Sans, system-ui, sans-serif" font-size="15">
  <title id="ocr-title">Radiator mass and chip life against radiator temperature</title>
  <desc id="ocr-desc">Two charts sharing a radiator temperature axis from 290 to 430 kelvin. Top: radiator mass per kilowatt at emissivity 0.9 and 5 kilograms per square metre falls from 6.9 kilograms at 290 K to 4.1 at 330 K and 1.9 at 400 K. Bottom: chip life, 10 years at an 85 C junction with the junction 25 K above the radiator, falls from 221 years at 290 K to 12 at 330 K and 0.3 at 400 K; chips rated for a 150 C junction would last 9 years at 400 K. Hotter radiators are lighter but wear chips out faster.</desc>
  <text x="20" y="30" fill="currentColor" font-size="18" font-weight="600">The central trade: hotter radiators are lighter, hotter chips die sooner</text>
  <text x="20" y="54" fill="currentColor" opacity="0.8">Emissivity 0.9, two faces, 5 kg/m² panels; chips rated 10 years at an 85 °C junction (Arrhenius, 0.7 eV)</text>
  <g stroke="currentColor" stroke-width="1" opacity="0.35" fill="none"><line x1="90" y1="80" x2="90" y2="230"/><line x1="90" y1="230" x2="760" y2="230"/></g>
  <text x="82" y="235" text-anchor="end" fill="currentColor" opacity="0.75">0</text><line x1="90" y1="230" x2="760" y2="230" stroke="currentColor" opacity="0.12"/>
  <text x="82" y="160" text-anchor="end" fill="currentColor" opacity="0.75">5</text><line x1="90" y1="155" x2="760" y2="155" stroke="currentColor" opacity="0.12"/>
  <text x="82" y="85" text-anchor="end" fill="currentColor" opacity="0.75">10</text><line x1="90" y1="80" x2="760" y2="80" stroke="currentColor" opacity="0.12"/>
  <text x="98" y="72" fill="currentColor" font-weight="600">Radiator mass, kg per kW</text>
