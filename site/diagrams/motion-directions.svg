<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-labelledby="eg-motion-directions-title eg-motion-directions-desc" class="editorial-graphic" font-family="system-ui, sans-serif">
<title id="eg-motion-directions-title">Three ways to move in a rotating world</title><desc id="eg-motion-directions-desc">A perspective sketch separates travel around, toward and along the axis.</desc>
<rect x="0" y="0" width="1000" height="630" rx="12" fill="var(--surface, #faf8f0)" stroke="none"></rect><path d="M32 23 h56" stroke="var(--accent, #28798a)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="32" y="65" fill="var(--text, #243a43)" font-size="30" text-anchor="start" font-weight="700">Three ways to move in a rotating world</text><text x="32" y="96" fill="var(--muted, #596b72)" font-size="18" text-anchor="start" font-weight="400">A perspective sketch separates travel around, toward and along the axis.</text><ellipse cx="440" cy="260" rx="170" ry="120" fill="none" stroke="var(--muted, #596b72)" stroke-width="2"></ellipse><path d="M120 350 L270 260 M460 350 L610 260 M290 470 L440 380" stroke="var(--muted, #596b72)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><ellipse cx="290" cy="350" rx="170" ry="120" fill="var(--surface-2, #ece9de)" stroke="var(--accent, #28798a)" stroke-width="4"></ellipse><circle cx="290" cy="350" r="8" fill="var(--surface, #faf8f0)" stroke="var(--text, #243a43)" stroke-width="2"></circle><g transform="translate(290 470) rotate(0) scale(0.9)"><circle cx="0" cy="-48" r="7" fill="var(--text, #243a43)" stroke="var(--text, #243a43)" stroke-width="2"></circle><path d="M0 -38 V-16 M-15 -29 L0 -35 L15 -29 M0 -16 L-12 0 M0 -16 L12 0" stroke="var(--text, #243a43)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M290 430 L290 375" stroke="var(--accent-2, #a36a20)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 285.0 386.0 L 290 375 L 295.0 386.0" stroke="var(--accent-2, #a36a20)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="317" y="420" fill="var(--accent-2, #a36a20)" font-size="19" text-anchor="start" font-weight="400">Radial climb</text><path d="M324 465 L405 440" stroke="var(--accent, #28798a)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 393.0 438.5 L 405 440 L 396.0 448.0" stroke="var(--accent, #28798a)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="450" y="482" fill="var(--accent, #28798a)" font-size="19" text-anchor="start" font-weight="400">Spinward walk</text><path d="M290 350 L440 260" stroke="var(--text, #243a43)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 428.0 261.4 L 440 260 L 433.1 269.9" stroke="var(--text, #243a43)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="485" y="249" fill="var(--text, #243a43)" font-size="19" text-anchor="start" font-weight="700">Along the axis</text><text x="635" y="332" fill="var(--muted, #596b72)" font-size="20" text-anchor="start" font-weight="400">Spinward: heavier</text><text x="635" y="360" fill="var(--muted, #596b72)" font-size="20" text-anchor="start" font-weight="400">Antispinward: lighter</text><text x="635" y="388" fill="var(--muted, #596b72)" font-size="20" text-anchor="start" font-weight="400"></text><text x="635" y="416" fill="var(--muted, #596b72)" font-size="20" text-anchor="start" font-weight="400">Radial motion:</text><text x="635" y="444" fill="var(--muted, #596b72)" font-size="20" text-anchor="start" font-weight="400">sideways Coriolis deflection</text><text x="635" y="472" fill="var(--muted, #596b72)" font-size="20" text-anchor="start" font-weight="400"></text><text x="635" y="500" fill="var(--muted, #596b72)" font-size="20" text-anchor="start" font-weight="400">Parallel to the spin axis:</text><text x="635" y="528" fill="var(--muted, #596b72)" font-size="20" text-anchor="start" font-weight="400">no Coriolis term</text><text x="320" y="568" fill="var(--muted, #596b72)" font-size="18" text-anchor="middle" font-weight="400">Arrows show motion, not gravity forces.</text><text x="32" y="608" fill="var(--muted, #596b72)" font-size="12" text-anchor="start" font-weight="600">CONCORDIA / ORIGINAL EXPLANATORY ILLUSTRATION</text>
</svg>
