ont-size="17" text-anchor="middle" font-weight="400">Spin → zero</text><text x="538" y="448" fill="var(--muted, #596b72)" font-size="17" text-anchor="start" font-weight="400">Spin down over 96 s.</text><text x="538" y="474" fill="var(--muted, #596b72)" font-size="17" text-anchor="start" font-weight="400">A gentle change of frame.</text><rect x="764" y="139" width="230" height="385" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--muted, #596b72)"></rect><circle cx="792" cy="167" r="16" fill="var(--accent, #28798a)" stroke="none" stroke-width="2"></circle><text x="792" y="174" fill="var(--surface, #faf8f0)" font-size="19" text-anchor="middle" font-weight="700">4</text><text x="819" y="174" fill="var(--text, #243a43)" font-size="21" text-anchor="start" font-weight="700">Enter the spine</text><circle cx="879" cy="286" r="67" fill="none" stroke="var(--text, #243a43)" stroke-width="5"></circle><rect x="844" y="244" width="70" height="84" rx="3" fill="var(--surface-2, #ece9de)" stroke="var(--text, #243a43)"></rect><g transform="translate(879 320) rotate(0) scale(0.8)"><circle cx="0" cy="-48" r="7" fill="var(--text, #243a43)" stroke="var(--text, #243a43)" stroke-width="2"></circle><path d="M0 -38 V-16 M-15 -29 L0 -35 L15 -29 M0 -16 L-12 0 M0 -16 L12 0" stroke="var(--text, #243a43)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></g><path d="M844 244 V328 M914 244 V328" stroke="var(--accent, #28798a)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M920 286 L968 286" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 957.0 281.0 L 968 286 L 957.0 291.0" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="879" y="386" fill="var(--accent, #28798a)" font-size="18" text-anchor="middle" font-weight="400">Stationary</text><text x