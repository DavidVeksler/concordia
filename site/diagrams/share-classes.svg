<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="eg-share-classes-title eg-share-classes-desc" class="editorial-graphic" font-family="system-ui, sans-serif">
<title id="eg-share-classes-title">Two kinds of owner</title><desc id="eg-share-classes-desc">Two columns. Founders’ shares vote by stake, elect the Proprietors’ Council with everyone else and run industry, leases, energy and compute. Resident shares are one per resident, never diluted or sold, pay the energy dividend and alone elect the residents’ authority that runs life support. A band across both says any change to the seven Covenant clauses needs two thirds of each class voting separately plus the Governor’s assent. A footer says residents can leave at no cost.</desc>
<rect x="0" y="0" width="1000" height="640" rx="12" fill="var(--surface, #faf8f0)" stroke="none"></rect><path d="M32 23 h56" stroke="var(--accent, #28798a)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="32" y="65" fill="var(--text, #243a43)" font-size="30" text-anchor="start" font-weight="700">Two kinds of owner</text><text x="32" y="96" fill="var(--muted, #596b72)" font-size="18" text-anchor="start" font-weight="400">Who holds what, and what neither can change alone. Concordia’s fictional 2045 charter.</text><rect x="32" y="130" width="460" height="290" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--muted, #596b72)"></rect><text x="52" y="165" fill="var(--text, #243a43)" font-size="21" text-anchor="start" font-weight="700">Founders’ shares</text><rect x="508" y="130" width="460" height="290" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--muted, #596b72)"></rect><text x="528" y="165" fill="var(--text, #243a43)" font-size="21" text-anchor="start" font-weight="700">Resident shares</text><text x="52" y="196" fill="var(--text, #243a43)" font-size="18" text-anchor="start" font-weight="400">Vote by stake</text><text x="52" y="230" fill="var(--text, #243a43)" font-size="18" text-anchor="start" font-weight="400">Elect the Proprietors’ Council, with everyone else</text><text x="52" y="264" fill="var(--text, #243a43)" font-size="18" text-anchor="start" font-weight="400">Run industry, leases, energy and compute,</text><text x="52" y="298" fill="var(--text, #243a43)" font-size="18" text-anchor="start" font-weight="400">and the next station</text><text x="52" y="332" fill="var(--text, #243a43)" font-size="18" text-anchor="start" font-weight="400">Cannot change the Covenant alone</text><text x="528" y="196" fill="var(--text, #243a43)" font-size="18" text-anchor="start" font-weight="400">One share per resident</text><text x="528" y="230" fill="var(--text, #243a43)" font-size="18" text-anchor="start" font-weight="400">Never diluted, never sold to a third party</text><text x="528" y="264" fill="var(--text, #243a43)" font-size="18" text-anchor="start" font-weight="400">Paid the energy dividend</text><text x="528" y="298" fill="var(--text, #243a43)" font-size="18" text-anchor="start" font-weight="400">Elect the residents’ authority alone:</text><text x="528" y="332" fill="var(--text, #243a43)" font-size="18" text-anchor="start" font-weight="400">air, water, pressure, heat, fire and spin</text><rect x="32" y="444" width="936" height="84" rx="10" fill="var(--surface, #faf8f0)" stroke="var(--accent-2, #a36a20)"></rect><text x="500" y="480" fill="var(--text, #243a43)" font-size="21" text-anchor="middle" font-weight="700">Any change to the seven clauses of the Covenant</text><text x="500" y="510" fill="var(--muted, #596b72)" font-size="18" text-anchor="middle" font-weight="400">two thirds of each class, voting separately, plus the Governor’s assent</text><path d="M262 420 V444 M738 420 V444" stroke="var(--accent-2, #a36a20)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="500" y="568" fill="var(--accent, #28798a)" font-size="18" text-anchor="middle" font-weight="600">Or leave, at no cost to the resident: the funded passage home (clause C5).</text><text x="32" y="618" fill="var(--muted, #596b72)" font-size="12" text-anchor="start" font-weight="600">CONCORDIA / ORIGINAL EXPLANATORY ILLUSTRATION</text>
</svg>
