    <text x="582" y="140"><tspan font-weight="600">Ground, radius 2,500 m</tspan><tspan x="582" dy="20" opacity="0.8">1.00 g, 1 atm air</tspan></text>
    <text x="582" y="210"><tspan font-weight="600">Artificial sky, 450 m up</tspan><tspan x="582" dy="20" opacity="0.8">0.82 g</tspan></text>
    <text x="582" y="280"><tspan font-weight="600">Farm galleries</tspan><tspan x="582" dy="20" opacity="0.8">1,000 m up, 0.60 g</tspan></text>
    <text x="582" y="350"><tspan font-weight="600">Megaframe top, 1,500 m up</tspan><tspan x="582" dy="20" opacity="0.8">0.40 g</tspan></text>
    <text x="582" y="430"><tspan font-weight="600">Hub and spine on the axis</tspan><tspan x="582" dy="20" opacity="0.8">radius 140 m, about 0 g</tspan></text>
    <text x="582" y="500" opacity="0.8" font-size="15">Gold: four ascender towers</text>
    <text x="582" y="520" opacity="0.8" font-size="15">from the ground to the hub</text>
    <text x="582" y="556" opacity="0.8" font-size="15">Thin ribs: 24 megaframe cells</text>
    <text x="288" y="688" text-anchor="middle" opacity="0.8" font-size="15">Drawn to scale. The spin axis points out of the page.</text>
  </g>
</svg>
