  </g>
  <circle cx="288" cy="365" r="87.7" fill="var(--bg)" stroke="currentColor" stroke-width="1.5" opacity="0.9"/>
  <circle cx="288" cy="365" r="131.6" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="288" cy="365" r="179.9" fill="none" stroke="var(--accent)" stroke-width="3"/>
