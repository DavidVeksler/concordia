    <line x1="203.2" y1="387.7" x2="76.1" y2="421.8"/>
    <line x1="212.0" y1="408.9" x2="98.0" y2="474.7"/>
    <line x1="226.0" y1="427.0" x2="132.9" y2="520.1"/>
