<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-labelledby="rcs-title rcs-desc" font-family="DM Sans, system-ui, sans-serif" font-size="16">
  <title id="rcs-title">End-on cross-section of a Concordia rotor</title>
  <desc id="rcs-desc">Concentric rings drawn to scale. The stationary shell has radius 3,100 m. Inside it the rotating ground sits at 2,500 m radius with 1 g. The artificial sky floats 450 m above the ground at 2,050 m radius with 0.82 g. Crop galleries sit 1,000 m up at 1,500 m radius with 0.6 g. The megaframe reaches 1,500 m up, to 1,000 m radius, at 0.4 g. Four ascender towers run from the ground to the hub and stationary spine on the axis, where gravity is near zero.</desc>
