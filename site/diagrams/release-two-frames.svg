<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="eg-release-two-frames-title eg-release-two-frames-desc" class="editorial-graphic" font-family="system-ui, sans-serif">
<title id="eg-release-two-frames-title">One coin. Two descriptions of its motion.</title><desc id="eg-release-two-frames-desc">Dots mark equal time steps within each view; the two drawing scales differ.</desc>
