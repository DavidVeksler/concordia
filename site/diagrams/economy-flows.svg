<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="eg-economy-flows-title eg-economy-flows-desc" class="editorial-graphic" font-family="system-ui, sans-serif">
<title id="eg-economy-flows-title">From capital to a city that earns</title><desc id="eg-economy-flows-desc">Concordia’s fictional 2045 economy. Arrow widths do not represent amounts.</desc>
<rect x="0" y="0" width="1000" height="620" rx="12" fill="var(--surface, #faf8f0)" stroke="none"></rect><path d="M32 23 h56" stroke="var(--accent, #28798a)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="32" y="65" fill="var(--text, #243a43)" font-size="30" text-anchor="start" font-weight="700">From capital to a city that earns</text><text x="32" y="96" fill="var(--muted, #596b72)" font-size="18" text-anchor="start" font-weight="400">Concordia’s fictional 2045 economy. Arrow widths do not represent amounts.</text><rect x="35" y="140" width="265" height="133" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--muted, #596b72)"></rect><text x="55" y="175" fill="var(--text, #243a43)" font-size="21" text-anchor="start" font-weight="700">Owners and investors</text><text x="55" y="210" fill="var(--muted, #596b72)" font-size="19" text-anchor="start" font-weight="400">Capital buys the seed</text><text x="55" y="237" fill="var(--muted, #596b72)" font-size="19" text-anchor="start" font-weight="400">factory and power base</text><rect x="365" y="140" width="270" height="133" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--muted, #596b72)"></rect><text x="385" y="175" fill="var(--text, #243a43)" font-size="21" text-anchor="start" font-weight="700">Factory + power</text><text x="385" y="210" fill="var(--muted, #596b72)" font-size="19" text-anchor="start" font-weight="400">Builds more infrastructure</text><text x="385" y="237" fill="var(--muted, #596b72)" font-size="19" text-anchor="start" font-weight="400">and saleable capacity</text><rect x="700" y="140" width="265" height="133" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--muted, #596b72)"></rect><text x="720" y="175" fill="var(--text, #243a43)" font-size="21" text-anchor="start" font-weight="700">Customers</text><text x="720" y="210" fill="var(--muted, #596b72)" font-size="19" text-anchor="start" font-weight="400">Buy computation, ships</text><text x="720" y="237" fill="var(--muted, #596b72)" font-size="19" text-anchor="start" font-weight="400">and propellant</text><path d="M305 205 L357 205" stroke="var(--accent-2, #a36a20)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 346.0 200.0 L 357 205 L 346.0 210.0" stroke="var(--accent-2, #a36a20)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M641 184 L692 184" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 681.0 179.0 L 692 184 L 681.0 189.0" stroke="var(--accent, #28798a)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M692 239 L641 239" stroke="var(--accent-2, #a36a20)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"></path><path d="M 652.0 244.0 L 641 239 L 652.0 234.0" stroke="var(--accent-2, #a36a20)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="661" y="167" fill="var(--accent, #28798a)" font-size="16" text-anchor="middle" font-weight="400">value</text><text x="665" y="263" fill="var(--accent-2, #a36a20)" font-size="15" text-anchor="middle" font-weight="400">revenue</text><rect x="35" y="375" width="265" height="137" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--muted, #596b72)"></rect><text x="55" y="410" fill="var(--text, #243a43)" font-size="21" text-anchor="start" font-weight="700">Maintain</text><text x="55" y="446" fill="var(--muted, #596b72)" font-size="18" text-anchor="start" font-weight="400">Air, spin, cooling</text><text x="55" y="473" fill="var(--muted, #596b72)" font-size="18" text-anchor="start" font-weight="400">and repairs</text><rect x="365" y="375" width="265" height="137" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--muted, #596b72)"></rect><text x="385" y="410" fill="var(--text, #243a43)" font-size="21" text-anchor="start" font-weight="700">Expand</text><text x="385" y="446" fill="var(--muted, #596b72)" font-size="18" text-anchor="start" font-weight="400">New platforms, ships</text><text x="385" y="473" fill="var(--muted, #596b72)" font-size="18" text-anchor="start" font-weight="400">and the next station</text><rect x="700" y="375" width="265" height="137" rx="12" fill="var(--surface, #faf8f0)" stroke="var(--muted, #596b72)"></rect><text x="720" y="410" fill="var(--text, #243a43)" font-size="21" text-anchor="start" font-weight="700">Residents</text><text x="720" y="446" fill="var(--muted, #596b72)" font-size="18" text-anchor="start" font-weight="400">A share of energy revenue</text><text x="720" y="473" fill="var(--muted, #596b72)" font-size="18" text-anchor="start" font-weight="400">paid as a dividend</text><path d="M500 280 V326 H166 V367 M500 326 V367 M500 326 H832 V367" stroke="var(--accent-2, #a36a20)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><text x="500" y="563" fill="var(--muted, #596b72)" font-size="17" text-anchor="middle" font-weight="400">Connections show the story’s business model, not audited financial shares.</text><text x="32" y="598" fill="var(--muted, #596b72)" font-size="12" text-anchor="start" font-weight="600">CONCORDIA / ORIGINAL EXPLANATORY ILLUSTRATION</text>
